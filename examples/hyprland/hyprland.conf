# Hyprland (hyprlang config). Same as hyprland.lua.
# Rule syntax for Hyprland before the 0.53 rules rework; on newer versions
# write the equivalent `match:namespace ^rofi$` rule (see the wiki), or use
# the Lua config.
bind = SUPER, SPACE, exec, rofi -show apps

layerrule = blur, ^rofi$
layerrule = ignorealpha 0.01, ^rofi$
layerrule = dimaround, ^rofi$
